  <script>
    function isSameSiteCallback(callbackUrl) {
      if (!callbackUrl) return false;
      if (callbackUrl.startsWith('/') || callbackUrl.startsWith('.')) {
        return true;
      }
      try {
        const url = new URL(callbackUrl, window.location.origin);
        if (url.origin === window.location.origin) {
          return true;
        }
        if (url.hostname === 'getmaterio.app' || url.hostname.endsWith('.getmaterio.app')) {
          return true;
        }
        const currentHost = window.location.hostname;
        if (currentHost.startsWith('sso.')) {
          const parentHost = currentHost.substring(4);
          if (url.hostname === parentHost) {
            return true;
          }
        }
      } catch (e) {
        return true;
      }
      return false;
    }

    // Run redirect check immediately (before DOMContentLoaded) to prevent flashing
    (function () {
      const tokenRow = document.cookie.split('; ').find(row => row.startsWith('materio_auth_token='));
      const tokenLocal = localStorage.getItem('materio_auth_token');
      const hasToken = !!(tokenRow || tokenLocal);

      const urlParams = new URLSearchParams(window.location.search);
      const clientId = urlParams.get('client_id');
      const callback = urlParams.get('callback');

      if (clientId || (callback && !isSameSiteCallback(callback))) {
        if (hasToken) {
          // Sync cookie if only in localStorage
          if (!tokenRow && tokenLocal) {
            const expiryDate = new Date();
            expiryDate.setDate(expiryDate.getDate() + 30);
            let cookieString = `materio_auth_token=${tokenLocal}; path=/; expires=${expiryDate.toUTCString()}; SameSite=Lax`;
            if (window.location.hostname.endsWith('getmaterio.app')) {
              cookieString += '; domain=.getmaterio.app';
            }
            document.cookie = cookieString;
          }
          window.location.replace('/account/sso/' + window.location.search);
        }
      }
    })();

    // Check for dark mode cookie
    document.addEventListener('DOMContentLoaded', function () {
      const darkModeCookie = document.cookie.split('; ').find(row => row.startsWith('darkMode='));
      if (darkModeCookie && darkModeCookie.split('=')[1] === 'true') {
        document.body.classList.add('dark-mode');
      }

      const tokenRow = document.cookie.split('; ').find(row => row.startsWith('materio_auth_token='));
      const tokenLocal = localStorage.getItem('materio_auth_token');
      const hasToken = !!(tokenRow || tokenLocal);

      const urlParams = new URLSearchParams(window.location.search);
      const clientId = urlParams.get('client_id');
      const callback = urlParams.get('callback');

      // If client_id or non-same-site callback is present, we already redirected or need to stay to show login form
      if (clientId || (callback && !isSameSiteCallback(callback))) {
        return;
      }

      if (hasToken) {
        const authToken = tokenRow ? tokenRow.split('=')[1] : tokenLocal;
        const redirectUrl = urlParams.get('callback');

        if (redirectUrl) {
          const referrer = document.referrer;
          const targetUrl = new URL(redirectUrl, window.location.origin);

          if (referrer && (referrer.includes(targetUrl.pathname) || targetUrl.href.includes(referrer))) {
            console.warn('Redirect loop detected. Clearing invalid token.');
            document.cookie = 'materio_auth_token=; path=/; expires=Thu, 01 Jan 1970 00:00:01 GMT;';
            localStorage.removeItem('materio_auth_token');
            return;
          }

          // Sync cookie if only in localStorage
          if (!tokenRow && tokenLocal) {
            const expiryDate = new Date();
            expiryDate.setDate(expiryDate.getDate() + 30);
            let cookieString = `materio_auth_token=${tokenLocal}; path=/; expires=${expiryDate.toUTCString()}; SameSite=Lax`;
            if (window.location.hostname.endsWith('getmaterio.app')) {
              cookieString += '; domain=.getmaterio.app';
            }
            document.cookie = cookieString;
          }

          console.log('Creating handoff for existing user...');
          fetch('/api/v2/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            }
          })
            .then(response => response.json())
            .then(data => {
              if (data.handoffCode) {
                targetUrl.searchParams.set('handoff', data.handoffCode);
                window.location.replace(targetUrl.toString());
              } else {
                window.location.replace(redirectUrl);
              }
            })
            .catch(error => {
              console.error('Handoff creation failed:', error);
              window.location.replace(redirectUrl);
            });
          return;
        } else {
          if (document.referrer && document.referrer.includes('/account/profile')) {
            document.cookie = 'materio_auth_token=; path=/; expires=Thu, 01 Jan 1970 00:00:01 GMT;';
            localStorage.removeItem('materio_auth_token');
            return;
          }
          window.location.replace('/account/profile');
          return;
        }
      }
    });
  </script>
</head>

  <script>
    // Check for dark mode when page loads
    function checkAndApplyDarkMode() {
      // Check for dark mode preference in localStorage
      const darkModePreference = localStorage.getItem('darkMode');

      // Check for theme cookie as fallback
      const themeCookie = document.cookie.split('; ').find(row => row.startsWith('theme='));
      const cookieValue = themeCookie ? themeCookie.split('=')[1] : null;
      const cookieIsDark = cookieValue === 'dark';

      // Check system preference
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      // Determine if dark mode should be enabled
      let shouldUseDarkMode = false;

      if (darkModePreference !== null) {
        // Use stored preference
        shouldUseDarkMode = darkModePreference === 'true';
      } else if (cookieValue) {
        // Use cookie value
        shouldUseDarkMode = cookieIsDark;
      } else {
        // Use system preference
        shouldUseDarkMode = systemPrefersDark;
      }

      // Apply dark mode class
      if (shouldUseDarkMode) {
        document.body.classList.add('dark-mode');
      } else {
        document.body.classList.remove('dark-mode');
      }
    }

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      // Only auto-switch if no manual preference is set
      if (localStorage.getItem('darkMode') === null) {
        if (e.matches) {
          document.body.classList.add('dark-mode');
        } else {
          document.body.classList.remove('dark-mode');
        }
      }
    });

    // Run on page load
    checkAndApplyDarkMode();

    // --- LOGIN PHASE TOGGLING ---
    const passwordPhase = document.getElementById('passwordPhase');
    const otpPhase = document.getElementById('otpPhase');
    const otpPhase1 = document.getElementById('otpPhase-1');
    const otpPhase2 = document.getElementById('otpPhase-2');

    const otpLoginBtn = document.getElementById('otpLoginBtn');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const backToPasswordBtn = document.getElementById('backToPasswordBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    if (otpLoginBtn) {
      otpLoginBtn.addEventListener('click', () => {
        passwordPhase.classList.add('hidden');
        otpPhase.classList.remove('hidden');
        otpPhase1.classList.remove('hidden');
        otpPhase2.classList.add('hidden');

        // Remove required from hidden inputs to fix browser validation
        if (usernameInput) usernameInput.required = false;
        if (passwordInput) passwordInput.required = false;
      });
    }

    if (sendOtpBtn) {
      sendOtpBtn.addEventListener('click', async () => {
        const email = document.getElementById('otpEmail').value.trim();
        const feedback = document.getElementById('msg-form');

        if (!email) {
          if (feedback) feedback.textContent = 'Account email required';
          return;
        }

        try {
          // Set Loading UI
          const btnText = sendOtpBtn.querySelector('.btn-text');
          const originalText = btnText.textContent;
          btnText.textContent = 'Sending...';
          sendOtpBtn.disabled = true;

          const response = await fetch('/api/v2/auth?action=otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, type: 'login' })
          });

          const data = await response.json();

          if (response.ok) {
            otpPhase1.classList.add('hidden');
            otpPhase2.classList.remove('hidden');
            if (feedback) feedback.textContent = '';
          } else {
            if (feedback) feedback.textContent = data.error || 'Identity not found';
          }
        } catch (err) {
          if (feedback) feedback.textContent = 'Connection lost. Try again.';
        } finally {
          const btnText = sendOtpBtn.querySelector('.btn-text');
          if (btnText) btnText.textContent = 'Send Code';
          sendOtpBtn.disabled = false;
        }
      });
    }

    if (verifyOtpBtn) {
      verifyOtpBtn.addEventListener('click', async () => {
        const email = document.getElementById('otpEmail').value.trim();
        const otp = Array.from(otpInputs).map(i => i.value).join('');
        const feedback = document.getElementById('msg-form');

        if (otp.length < 6) {
          if (feedback) feedback.textContent = 'Please enter the 6-digit code';
          return;
        }

        try {
          verifyOtpBtn.disabled = true;
          verifyOtpBtn.textContent = 'Verifying...';

          const response = await fetch('/api/v2/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: email, otp, method: 'otp' })
          });

          const data = await response.json();

          if (response.ok && data.token) {
            // Standard success path from login.js
            if (typeof setAuthToken === 'function') {
              setAuthToken(data.token);
            } else {
              // Fallback direct set
              document.cookie = `materio_auth_token=${data.token}; path=/; max-age=86400; SameSite=Lax`;
              localStorage.setItem('materio_auth_token', data.token);
            }

            if (feedback) {
              feedback.textContent = 'Login successful!';
              feedback.style.color = '#10b981';
            }

            setTimeout(() => {
              const urlParams = new URLSearchParams(window.location.search);
              const clientId = urlParams.get('client_id');
              const callback = urlParams.get('callback');

              if (clientId || callback) {
                if (typeof window.showConsentPhase === 'function') {
                  window.showConsentPhase();
                } else {
                  window.location.replace(callback || '/account/profile');
                }
              } else {
                window.location.replace('/account/profile');
              }
            }, 1000);
          } else {
            if (feedback) feedback.textContent = data.error || 'Invalid verification code';
            verifyOtpBtn.disabled = false;
            verifyOtpBtn.textContent = 'Verify & Login';
          }
        } catch (err) {
          if (feedback) feedback.textContent = 'Verification failed. Try again.';
          verifyOtpBtn.disabled = false;
          verifyOtpBtn.textContent = 'Verify & Login';
        }
      });
    }

    if (backToPasswordBtn) {
      backToPasswordBtn.addEventListener('click', () => {
        otpPhase.classList.add('hidden');
        passwordPhase.classList.remove('hidden');
      });
    }

    // --- OTP GRID AUTOMATION ---
    const otpInputs = document.querySelectorAll('.otp-input');
    otpInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });

      // Handle Paste
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasteData = (e.clipboardData || window.clipboardData).getData('text').slice(0, 6);
        pasteData.split('').forEach((char, i) => {
          if (otpInputs[i]) {
            otpInputs[i].value = char;
            if (i < otpInputs.length - 1) otpInputs[i + 1].focus();
          }
        });
      });
    });
  </script>

  <script>
    // SSO Redirect and Init logic
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const clientId = urlParams.get('client_id');
      const callback = urlParams.get('callback');

      // Set up consent phase window-level function
      window.showConsentPhase = function () {
        if (callback && isSameSiteCallback(callback)) {
          // Bypass SSO, perform direct secure handoff and redirect
          const token = getAuthToken() || localStorage.getItem('materio_auth_token');
          fetch('/api/v2/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            }
          })
            .then(res => res.json())
            .then(data => {
              try {
                const targetUrl = new URL(callback, window.location.origin);
                if (data.handoffCode) {
                  targetUrl.searchParams.set('handoff', data.handoffCode);
                }
                window.location.replace(targetUrl.toString());
              } catch (e) {
                window.location.replace(callback);
              }
            })
            .catch(() => {
              window.location.replace(callback);
            });
        } else {
          window.location.replace('/account/sso/' + window.location.search);
        }
      };

      // If same-site callback is present and no client_id, it is NOT an external SSO flow.
      if (!clientId && (!callback || isSameSiteCallback(callback))) {
        return; // Normal login flow
      }

      // Customize login header to reflect authorization context
      const loginHeaderTitle = document.querySelector('.auth-header h1');
      const loginHeaderSub = document.querySelector('.auth-header p');
      if (loginHeaderTitle) loginHeaderTitle.textContent = 'Log in to authorize';
      if (loginHeaderSub) loginHeaderSub.textContent = 'Please log in to continue to the application.';

      // Check if already authenticated
      const tokenRow = document.cookie.split('; ').find(row => row.startsWith('materio_auth_token='));
      if (tokenRow) {
        window.showConsentPhase();
      }
    })();
  </script>
