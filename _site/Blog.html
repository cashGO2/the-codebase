<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>The InsightRoom.</title><link rel="stylesheet" href="/assets/style/style.css"></head><body><header class="site-header"><a href="/#" class="header-logo" role="button" aria-label="Go to homepage"></a></header><main class="home-container"><div class="post-grid"></div></main><main class="post-container"><article class="post"><p class="post-date"></p><h1 class="post-title"></h1><div class="post-body"></div></article></main><footer class="site-footer"><div class="footer-content"><p>&copy; 2025 The InsightRoom. All rights reserved.</p></div><div class="theme-switcher" style="margin-top:1rem;margin-left:0;background:var(--bg-color);border-radius:9999px;display:flex;gap:.5rem;padding:.5rem 1rem;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);align-items:center;width:fit-content"><button aria-label="Light Mode" onclick='setTheme("light")' id="light-btn" style="background:0 0;border:none;cursor:pointer;font-size:1rem;color:var(--text-color)"><i class="fa-regular fa-sun-bright"></i></button> <button aria-label="Dark Mode" onclick='setTheme("dark")' id="dark-btn" style="background:0 0;border:none;cursor:pointer;font-size:1rem;color:var(--text-color)"><i class="fa-regular fa-moon"></i></button> <button aria-label="System Theme" onclick='setTheme("system")' id="system-btn" style="background:0 0;border:none;cursor:pointer;font-size:1rem;color:var(--text-color)"><i class="fa-regular fa-desktop"></i></button></div><div class="footer-img"><img src="/assets/img/The InsightRoom.png"></div><script>document.addEventListener("DOMContentLoaded",(()=>{const e=document.documentElement;function t(t){if(localStorage.setItem("theme",t),"light"===t)e.classList.remove("dark");else if("dark"===t)e.classList.add("dark");else{const t=window.matchMedia("(prefers-color-scheme: dark)").matches;e.classList.toggle("dark",t)}}document.querySelectorAll(".theme-btn").forEach((e=>{e.addEventListener("click",(()=>{t(e.dataset.theme)}))}));t(localStorage.getItem("theme")||"system")}))</script></footer></body></html>
