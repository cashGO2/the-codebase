<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Drive Files</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/redesigned-styles.css"><style>.files-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.upload-area{border:2px dashed #ddd;border-radius:10px;padding:40px;text-align:center;background-color:rgba(255,245,223,.3);margin-bottom:30px;transition:all .3s ease;cursor:pointer}.upload-area:hover{border-color:#ff8200;background-color:rgba(255,130,0,.1)}.upload-area.dragover{border-color:#ff8200;background-color:rgba(255,130,0,.2)}.upload-icon{font-size:48px;color:#ff8200;margin-bottom:15px}.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-top:20px}.file-card{background-color:rgba(255,245,223,.8);backdrop-filter:blur(10px);border-radius:10px;padding:15px;box-shadow:0 4px 6px rgba(0,0,0,.1);transition:transform .2s ease;cursor:pointer}.file-card:hover{transform:translateY(-2px);box-shadow:0 6px 12px rgba(0,0,0,.15)}.file-icon{font-size:32px;text-align:center;margin-bottom:10px;color:#ff8200}.file-name{font-weight:600;margin-bottom:5px;word-break:break-word}.file-size{font-size:12px;color:#666;margin-bottom:10px}.file-actions{display:flex;gap:10px;justify-content:center}.file-action-btn{background:0 0;border:none;padding:5px;cursor:pointer;border-radius:4px;transition:background-color .2s ease}.file-action-btn:hover{background-color:rgba(255,130,0,.1)}.loading-spinner{text-align:center;padding:40px}.spinner{width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #ff8200;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.back-button{background-color:rgba(255,245,223,.8);backdrop-filter:blur(10px);border:none;padding:10px 20px;border-radius:8px;color:#333;text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-family:Manrope,sans-serif;font-weight:500;transition:all .3s ease}.back-button:hover{background-color:rgba(255,130,0,.1);transform:translateY(-1px)}.empty-state{text-align:center;padding:60px 20px;color:#666}.empty-state i{font-size:64px;color:#ddd;margin-bottom:20px}body.dark-mode .upload-area{background-color:rgba(51,51,51,.3);border-color:#555}body.dark-mode .upload-area:hover{border-color:#ff8200;background-color:rgba(255,130,0,.1)}body.dark-mode .file-card{background-color:rgba(51,51,51,.8);color:#fff}body.dark-mode .file-size{color:#ccc}body.dark-mode .back-button{background-color:rgba(51,51,51,.8);color:#fff}</style><script>document.addEventListener("DOMContentLoaded",(function(){const t=document.cookie.split("; ").find((t=>t.startsWith("darkMode=")));t&&"true"===t.split("=")[1]&&document.body.classList.add("dark-mode")}))</script></head><body><div class="profile-container"><div class="sidebar"><button class="sidebar-close-btn" aria-label="Close menu"><i class="fas fa-times"></i></button><div class="sidebar-header"><img src="images/materio_new_bk.svg" alt="Materio Logo" class="logo" id="logo-light"> <img src="images/materio_new_wh.svg" alt="Materio Logo" class="logo" id="logo-dark" style="display:none"></div><div class="sidebar-nav"><button class="sidebar-nav-item" data-tab="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</button> <button class="sidebar-nav-item" data-tab="security"><i class="fas fa-shield-alt"></i> Security</button> <button class="sidebar-nav-item" data-tab="danger"><i class="fas fa-exclamation-triangle"></i> Danger Zone</button></div><div class="sidebar-footer"><button class="theme-toggle" id="theme-toggle" title="Toggle theme"><i class="fas fa-moon" id="theme-icon"></i></button> <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button></div></div><div class="main-content"><button class="mobile-menu-btn" aria-label="Open menu"><i class="fas fa-bars"></i></button><div class="content-wrapper"><div class="files-header"><div><a href="profile.html" class="back-button"><i class="fas fa-arrow-left"></i> Back to Dashboard</a></div><h1>My Files</h1><button id="refreshFilesBtn" class="btn btn-outline"><i class="fas fa-sync-alt"></i> Refresh</button></div><div class="card-layout"><div class="upload-area" id="uploadArea" onclick='document.getElementById("fileInput").click()'><div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div><h3>Upload Files</h3><p>Click here or drag and drop files to upload to your Google Drive</p><input type="file" id="fileInput" multiple="multiple" style="display:none"></div></div><div class="card-layout"><h3>Your Files</h3><div id="filesContainer"><div class="loading-spinner" id="loadingSpinner"><div class="spinner"></div><p>Loading your files...</p></div></div></div></div></div></div><div id="filePreviewModal" class="modal" style="display:none"><div class="modal-content"><div class="modal-header"><h3 id="previewFileName">File Preview</h3><button class="modal-close" onclick="closeFilePreview()"><i class="fas fa-times"></i></button></div><div class="modal-body"><div id="previewContent"></div></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeFilePreview()">Close</button> <button class="btn btn-primary" id="downloadFileBtn"><i class="fas fa-download"></i> Download</button></div></div></div><script src="js/auth.js"></script><script src="js/profile.js"></script><script>class FilesManager extends GoogleDriveManager{constructor(){super(),this.initFilesPage()}initFilesPage(){this.setupDragAndDrop(),this.loadFiles();const e=document.getElementById("linkDriveBtn"),i=document.getElementById("unlinkDriveBtn");e&&(e.style.display="none"),i&&(i.style.display="none")}setupDragAndDrop(){const e=document.getElementById("uploadArea");["dragenter","dragover","dragleave","drop"].forEach((i=>{e.addEventListener(i,this.preventDefaults,!1)})),["dragenter","dragover"].forEach((i=>{e.addEventListener(i,(()=>e.classList.add("dragover")),!1)})),["dragleave","drop"].forEach((i=>{e.addEventListener(i,(()=>e.classList.remove("dragover")),!1)})),e.addEventListener("drop",(e=>this.handleDrop(e)),!1)}preventDefaults(e){e.preventDefault(),e.stopPropagation()}handleDrop(e){const i=e.dataTransfer.files;i.length>0&&this.uploadFiles(i)}handleFileUpload(e){const i=e.target.files;i.length>0&&this.uploadFiles(i)}async uploadFiles(e){const i=document.getElementById("uploadArea");i.innerHTML='\n          <div class="upload-icon">\n            <i class="fas fa-spinner fa-spin"></i>\n          </div>\n          <h3>Uploading...</h3>\n          <p>Please wait while your files are being uploaded</p>\n        ';try{for(let i of e)await this.uploadFile(i);this.showSuccess("Files uploaded successfully!"),this.loadFiles()}catch(e){this.showError("Upload failed: "+e.message)}finally{i.innerHTML='\n            <div class="upload-icon">\n              <i class="fas fa-cloud-upload-alt"></i>\n            </div>\n            <h3>Upload Files</h3>\n            <p>Click here or drag and drop files to upload to your Google Drive</p>\n            <input type="file" id="fileInput" multiple style="display: none;">          ',i.onclick=()=>document.getElementById("fileInput").click();const e=document.getElementById("fileInput");e&&e.addEventListener("change",(e=>this.handleFileUpload(e)))}}renderFiles(e){const i=document.getElementById("filesContainer");if(0===e.length)return void(i.innerHTML='\n            <div class="empty-state">\n              <i class="fas fa-folder-open"></i>\n              <h3>No files found</h3>\n              <p>Upload some files to get started!</p>\n            </div>\n          ');const n=e.map((e=>`\n          <div class="file-card" onclick="previewFile('${e.id}', '${e.name}', '${e.mimeType}')">\n            <div class="file-icon">\n              ${this.getFileIcon(e.mimeType)}\n            </div>\n            <div class="file-name">${e.name}</div>\n            <div class="file-size">${this.formatFileSize(e.size)}</div>\n            <div class="file-actions">\n              <button class="file-action-btn" onclick="event.stopPropagation(); previewFile('${e.id}', '${e.name}', '${e.mimeType}')" title="Preview">\n                <i class="fas fa-eye"></i>\n              </button>\n              <button class="file-action-btn" onclick="event.stopPropagation(); downloadFile('${e.id}', '${e.name}')" title="Download">\n                <i class="fas fa-download"></i>\n              </button>\n              <button class="file-action-btn" onclick="event.stopPropagation(); deleteFile('${e.id}', '${e.name}')" title="Delete">\n                <i class="fas fa-trash"></i>\n              </button>\n            </div>\n          </div>\n        `)).join("");i.innerHTML=`<div class="files-grid">${n}</div>`}getFileIcon(e){return e.startsWith("image/")?'<i class="fas fa-image"></i>':e.startsWith("video/")?'<i class="fas fa-video"></i>':e.startsWith("audio/")?'<i class="fas fa-music"></i>':e.includes("pdf")?'<i class="fas fa-file-pdf"></i>':e.includes("word")||e.includes("document")?'<i class="fas fa-file-word"></i>':e.includes("sheet")||e.includes("excel")?'<i class="fas fa-file-excel"></i>':e.includes("presentation")||e.includes("powerpoint")?'<i class="fas fa-file-powerpoint"></i>':e.includes("zip")||e.includes("rar")?'<i class="fas fa-file-archive"></i>':'<i class="fas fa-file"></i>'}formatFileSize(e){if(0===e)return"0 Bytes";const i=Math.floor(Math.log(e)/Math.log(1024));return parseFloat((e/Math.pow(1024,i)).toFixed(2))+" "+["Bytes","KB","MB","GB"][i]}}function previewFile(e,i,n){console.log("Preview file:",i),window.filesManager&&window.open(`https://drive.google.com/file/d/${e}/view`,"_blank")}function downloadFile(e,i){window.filesManager&&window.filesManager.downloadFile(e,i)}function deleteFile(e,i){confirm(`Are you sure you want to delete "${i}"?`)&&window.filesManager&&window.filesManager.deleteFile(e,i)}function closeFilePreview(){document.getElementById("filePreviewModal").style.display="none"}document.addEventListener("DOMContentLoaded",(function(){"function"==typeof initializeDevelopmentMode&&initializeDevelopmentMode(),window.filesManager=new FilesManager;const e=document.getElementById("fileInput"),i=document.getElementById("refreshFilesBtn");e&&e.addEventListener("change",(e=>{window.filesManager.handleFileUpload(e)})),i&&i.addEventListener("click",(()=>{window.filesManager.loadFiles()}))}))</script></body></html>
