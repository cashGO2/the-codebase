<!DOCTYPE html>
<html lang="en">

<head> {% include head.html %}

    <!-- KaTeX for LaTeX rendering in notebooks -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <script>
        (function () {
            function getCookie(name) {
                var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                return match ? match[2] : null;
            }
            var theme = getCookie('theme');
            var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (theme === 'dark' || (!theme && systemDark)) {
                document.documentElement.classList.add('dark-mode');
                document.body && document.body.classList.add('dark-mode');
            }
        })();
    </script>
</head>

<body>

    <!-- Buy Me A Coffee Widget -->
    <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="jinansh_" data-description="Support me on Buy me a coffee!" data-color="#FF813F" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
    <script>
        (function () {
            function syncHomeTabClass() {
                var homeTabLinkActive = document.querySelector('.tab-link.active[data-tab="home"]');
                var homeContentActive = document.querySelector('#home.tab-content.active');
                var isHomeActive = !!homeTabLinkActive && !!homeContentActive;
                document.body.classList.toggle("home-tab-active", isHomeActive);
            }

            function syncPopupOpenClass() {
                var popup = document.getElementById("popup");
                if (!popup) {
                    document.body.classList.remove("reader-popup-open");
                    return;
                }

                var popupStyle = window.getComputedStyle(popup);
                var isOpen = popupStyle.display !== "none" && popupStyle.visibility !== "hidden";
                document.body.classList.toggle("reader-popup-open", isOpen);
            }

            document.addEventListener("DOMContentLoaded", function () {
                syncHomeTabClass();

                syncPopupOpenClass();
                var popup = document.getElementById("popup");
                if (popup && window.MutationObserver) {
                    var popupObserver = new MutationObserver(syncPopupOpenClass);
                    popupObserver.observe(popup, { attributes: true, attributeFilter: ["style", "class"] });
                }

                if (window.MutationObserver) {
                    var tabObserver = new MutationObserver(syncHomeTabClass);
                    tabObserver.observe(document.body, {
                        subtree: true,
                        attributes: true,
                        attributeFilter: ["class"]
                    });
                }
            });

            document.addEventListener("tabOpened", function (event) {
                syncHomeTabClass();
                syncPopupOpenClass();
            });
        })();
    </script>
    <style>
        /* High Z-Index for BMC Widget without breaking it */
        [id*="bmc-widget"] {
            z-index: 10001 !important;
        }

        /* Force compact 48x48 floating button and icon sizing */
        #bmc-wbtn {
            width: 48px !important;
            height: 48px !important;
            border-radius: 24px !important;
            right: 18px !important;
            bottom: 18px !important;
            transition: bottom 0.3s ease, transform 0.3s ease !important;
            transform: perspective(700px) rotateX(8deg) scale(1) !important;
            transform-origin: bottom right;
        }

        #bmc-wbtn img {
            width: 24px !important;
            height: 24px !important;
            transform: perspective(700px) rotateX(10deg) scale(0.95) !important;
            transform-origin: center;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.25));
        }
        
        /* Hide widget globally unless Home tab is active */
        body:not(.home-tab-active) #bmc-wbtn,
        body:not(.home-tab-active) #bmc-widget-message,
        body:not(.home-tab-active) .bmc-widget-container {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Hide when modals are open */
        body.modal-open #bmc-wbtn,
        body.modal-open #bmc-widget-message,
        body.modal-open .bmc-widget-container,
        body.reader-popup-open #bmc-wbtn,
        body.reader-popup-open #bmc-widget-message,
        body.reader-popup-open .bmc-widget-container,
        body.leaderboard-nudge-open #bmc-wbtn,
        body.leaderboard-nudge-open #bmc-widget-message,
        body.leaderboard-nudge-open .bmc-widget-container,
        body.profile-dropdown-open #bmc-wbtn,
        body.profile-dropdown-open #bmc-widget-message,
        body.profile-dropdown-open .bmc-widget-container {
            display: none !important;
        }

        /* Mobile positioning adjustment */
        @media (max-width: 768px) {
            #bmc-wbtn {
                bottom: 104px !important;
                right: 14px !important;
                transform: perspective(700px) rotateX(8deg) scale(0.98) !important;
                transform-origin: bottom right;
            }
        }
    </style>
</body>
